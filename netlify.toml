[build]
  command = "node scripts/build.mjs"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "https://www.shruthimatrimony.com/*"
  to = "https://shruthimatrimony.com/:splat"
  status = 301
  force = true

# Preserve previously shared illustration URLs after moving delivery to optimized variants.

[[redirects]]
  from = "/assets/invitation.webp"
  to = "/assets/drawings/invitation-1080.webp"
  status = 301

